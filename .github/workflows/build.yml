name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Unzip and build
        run: |
          shopt -s nullglob
          for z in *.zip; do
            echo "Unzipping $z"
            mkdir -p work && unzip -q -o "$z" -d work
          done
          FOUND=$(find . -name settings.gradle.kts -not -path "./.git/*" | head -1)
          if [ -z "$FOUND" ]; then
            echo "ERROR: Android project nahi mila. Repo mein ye files hain:"
            ls -la
            exit 1
          fi
          DIR=$(dirname "$FOUND")
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          cd "$DIR"
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" AirTouchLocal.apk
          gh release create "apk-${{ github.run_number }}" AirTouchLocal.apk \
            --title "AirTouch Local APK #${{ github.run_number }}" \
            --notes "Debug APK. Download AirTouchLocal.apk and install."
